name: daily-update

on:
  schedule:
    - cron: '0 3 * * *'          # UTC 03:00 — 市场 catalog 发布后同步
    - cron: '0 15 * * *'         # UTC 15:00 — 第二次同步
  workflow_dispatch:
    inputs:
      deploy_only:
        description: '快速部署：跳过 catalog 同步，重建 site/ 后发布'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  # ---------------- 单 job：sync → rank → pack → upload → publish ----------------
  # 上游 catalog 是一个 Pages JSON——一次 GET 同步全量，不需要分片。
  # 运行时零网络依赖：所有数据在 CI 内落盘为快照 + 静态 JSON。
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: daily-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Sync upstream catalog
        if: ${{ !inputs.deploy_only }}
        env:
          OCM_INDEX_URL: ${{ vars.OCM_INDEX_URL || 'https://terry2010.github.io/awesome-opencode-market/index.json' }}
        run: python scripts/sync_catalog.py

      - name: Rebuild rankings & site data
        run: python scripts/rank.py --site-base "${{ vars.SITE_BASE }}"

      - name: Commit data updates
        if: ${{ !inputs.deploy_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: catalog sync $(date -u +%FT%H:%MZ)"
          PRE=$(git rev-parse HEAD)
          if ! git pull --rebase origin main; then
            git status --porcelain | awk '$1 ~ /^(UU|AA|DD|AU|UA|DU|UD)$/{print $2}' | xargs -r git checkout --ours
            git status --porcelain | awk '$1 ~ /^(UU|AA|DD|AU|UA|DU|UD)$/{print $2}' | xargs -r git add
            GIT_EDITOR=true git rebase --continue
            python scripts/rank.py --site-base "${{ vars.SITE_BASE }}"
            git add -A
            git diff --cached --quiet || git commit -m "data: rebuild after rebase"
          elif ! git diff --quiet "$PRE" HEAD -- data/; then
            python scripts/rank.py --site-base "${{ vars.SITE_BASE }}"
            git add -A
            git diff --cached --quiet || git commit -m "data: rebuild after rebase"
          fi
          git push

      # site/data/* 以单文件 sqlite blob 推给 api（部署文件数上限约束，
      # 上传必须先于站点发布——失败则中止，不让页面上线后水合不到数据）。
      - name: Pack + upload data store to api
        env:
          DATA_UPLOAD_TOKEN: ${{ secrets.DATA_UPLOAD_TOKEN }}
        run: |
          python3 scripts/pack_data.py
          gzip -9 -c site-data.db > site-data.db.gz
          SHA=$(sha256sum site-data.db.gz | cut -d' ' -f1)
          RESP=$(curl -fsS -X POST "https://api.oplugin.com/data-upload" \
            -H "Authorization: Bearer $DATA_UPLOAD_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @site-data.db.gz)
          echo "$RESP"
          echo "$RESP" | grep -q "$SHA" || \
            { echo "::error::sha256 mismatch — upload corrupted"; exit 1; }

      # ~万级文件超出 actions/deploy-pages 同步预算；推 gh-pages 分支由
      # Pages 服务端构建，同时 Cloudflare Pages 作主发布。
      - name: Publish site to gh-pages
        run: |
          rm -rf /tmp/ghp-site
          cp -a site /tmp/ghp-site
          cd /tmp/ghp-site
          V="$(echo "${{ github.sha }}" | cut -c1-8)"
          find . -name "*.html" -exec sed -i -E \
            -e "s#(assets/[a-zA-Z0-9_./-]+\.(css|js))\"#\1?v=${V}\"#g" \
            -e "s#(assets/[a-zA-Z0-9_./-]+\.(css|js)\?v=)[0-9A-Za-z_-]+#\1${V}#g" \
            {} +
          git init -qb gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "deploy $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages

      - name: Deploy to Cloudflare Pages
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          test -f /tmp/ghp-site/index.html || { echo "site payload missing; skipping deploy"; exit 1; }
          rm -rf /tmp/cfp-site && mkdir -p /tmp/cfp-site
          rsync -a --exclude 'data/' /tmp/ghp-site/ /tmp/cfp-site/
          echo "deploy payload: $(find /tmp/cfp-site -type f | wc -l) files"
          npx -y wrangler@3 pages deploy /tmp/cfp-site --project-name=oplugin --branch=main
