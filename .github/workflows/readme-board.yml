name: readme-board

on:
  # Runs right after each daily-update sync so the README table tracks
  # the freshly committed board data.
  workflow_run:
    workflows: ["daily-update"]
    types: [completed]
  # Fallback once a day in case daily-update was skipped/manual.
  schedule:
    - cron: "30 16 * * *"  # 16:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-board
  cancel-in-progress: false

jobs:
  update:
    # Only run on successful daily-update completions (or cron/dispatch).
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild board data
        # site/data/ is gitignored build output — regenerate the day files
        # from committed snapshots so the README table uses real rankings.
        run: python3 scripts/rank.py --site-base https://opencode-plugins.zhuikan.com

      - name: Regenerate README top-20 tables
        run: python3 scripts/update_readme.py

      - name: Commit README changes
        run: |
          if git diff --quiet README.md README.zh.md; then
            echo "README tables already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh.md
          git commit -m "README: refresh top-20 new-arrival tables [skip ci]"
          git pull --rebase
          git push
